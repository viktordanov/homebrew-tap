name: Test formula

on:
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - ".github/workflows/test-formula.yml"
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/test-formula.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Audit macOS packages on Linux
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_SIMULATE_MACOS_ON_LINUX: 1

    steps:
      - name: Check out the tap
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@6373c73b318da78d7a3457597e6cc3b6526cbd59
        with:
          core: false
          cask: false

      - name: Examine the formula
        run: |
          set -euo pipefail
          brew style Formula/memoria.rb
          brew audit --strict viktordanov/tap/memoria
          brew readall --os=all --arch=all viktordanov/tap

      - name: Verify every published package
        run: |
          set -euo pipefail
          repository="$(sed -n 's/^[[:space:]]*homepage "\([^"]*\)"/\1/p' Formula/memoria.rb)"
          version="$(sed -n 's/^[[:space:]]*version "\([^"]*\)"/\1/p' Formula/memoria.rb)"
          mapfile -t hashes < <(grep -oE '[0-9a-f]{64}' Formula/memoria.rb)
          targets=(aarch64-apple-darwin x86_64-apple-darwin)

          test -n "$repository"
          test -n "$version"
          test "${#hashes[@]}" -eq 2

          for index in 0 1; do
            target="${targets[$index]}"
            archive="memoria-v${version}-${target}.tar.gz"
            url="${repository}/releases/download/memoria-v${version}/${archive}"

            curl --fail --location --retry 3 --output "$archive" "$url"
            echo "${hashes[$index]}  $archive" | sha256sum --check --strict
            mkdir -p "inspect-$target"
            tar -xzf "$archive" -C "inspect-$target"
            test -x "inspect-$target/memoria"
            test -f "inspect-$target/LICENSE"

            if [ "$target" = "aarch64-apple-darwin" ]; then
              file "inspect-$target/memoria" | grep -q 'Mach-O 64-bit arm64'
            else
              test "$target" = "x86_64-apple-darwin"
              file "inspect-$target/memoria" | grep -q 'Mach-O 64-bit x86_64'
            fi
          done
